<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnage Club Wiki</title>

    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="wiki/carnage-club-wiki.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="../../assets/js/i18n.js"></script>
</head>
<body>
<header class="site-header">
    <nav class="nav">
        <a class="brand" href="../../projects.html">
            <span data-i18n="ua">Назад</span>
            <span data-i18n="en" hidden>Back</span>
        </a>

        <div class="nav-right">
            <a class="projects-btn" href="../../projects.html">
                <span data-i18n="ua">Проєкти</span>
                <span data-i18n="en" hidden>Projects</span>
            </a>

            <div class="lang" aria-label="Language switch">
                <button class="lang-btn" data-lang="ua" type="button" aria-pressed="false">UA</button>
                <button class="lang-btn" data-lang="en" type="button" aria-pressed="false">EN</button>
            </div>
        </div>
    </nav>
</header>

<div class="layout">
    <aside aria-hidden="true" class="side side--left"></aside>

    <main class="center">
        <div class="container">
            <section class="section">
                <div class="card wiki-card">
                    <button id="wiki-mobile-toggle" class="wiki-mobile-toggle" type="button">
                        Contents
                    </button>

                    <div class="wiki-layout">
                        <aside id="wiki-sidebar"></aside>
                        <article id="wiki-content"></article>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <aside aria-hidden="true" class="side side--right"></aside>
</div>

<div id="wiki-sidebar-overlay"></div>

<div id="wiki-lightbox" class="wiki-lightbox" hidden>
    <div class="wiki-lightbox__content">
        <button id="wiki-lightbox-close" class="wiki-lightbox__close" type="button" aria-label="Close">×</button>
        <div id="wiki-lightbox-media" class="wiki-lightbox__media"></div>
    </div>
</div>

<script src="wiki/carnage-club-wiki.js"></script>
</body>
</html>
